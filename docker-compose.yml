version: '3.8'

services:
  # Application Laravel
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comptapro-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./storage/app:/var/www/storage/app
      - ./storage/logs:/var/www/storage/logs
    networks:
      - comptapro-network
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost}
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-comptapro}
      - DB_USERNAME=${DB_USERNAME:-comptapro}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
      - CACHE_DRIVER=redis
      - SESSION_DRIVER=redis
    depends_on:
      - db
      - redis

  # Serveur Web Nginx
  nginx:
    image: nginx:alpine
    container_name: comptapro-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
      - "${APP_SSL_PORT:-443}:443"
    volumes:
      - ./:/var/www
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
      - ./docker/ssl:/etc/nginx/ssl
    networks:
      - comptapro-network
    depends_on:
      - app

  # Base de données PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: comptapro-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${DB_DATABASE:-comptapro}
      - POSTGRES_USER=${DB_USERNAME:-comptapro}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - comptapro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-comptapro}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis pour cache et queues
  redis:
    image: redis:7-alpine
    container_name: comptapro-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    networks:
      - comptapro-network
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Worker pour les queues
  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comptapro-queue-worker
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - comptapro-network
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-comptapro}
      - DB_USERNAME=${DB_USERNAME:-comptapro}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
      - QUEUE_CONNECTION=redis
    depends_on:
      - db
      - redis
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600

  # Scheduler pour les tâches programmées
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: comptapro-scheduler
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - comptapro-network
    environment:
      - APP_ENV=${APP_ENV:-production}
      - DB_HOST=db
      - DB_DATABASE=${DB_DATABASE:-comptapro}
      - DB_USERNAME=${DB_USERNAME:-comptapro}
      - DB_PASSWORD=${DB_PASSWORD}
      - REDIS_HOST=redis
    depends_on:
      - db
      - redis
    command: /bin/sh -c "while true; do php artisan schedule:run --verbose --no-interaction & sleep 60; done"

networks:
  comptapro-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
